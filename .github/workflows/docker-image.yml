# Builds the Docker image. Not active yet: it only runs when started by hand
# (Actions tab -> "Docker image" -> Run workflow). To enable automatic builds,
# uncomment the push / pull_request triggers below.
name: Docker image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also push the image to ghcr.io"
        type: boolean
        default: false
  # push:
  #   branches: [main]
  #   tags: ["v*"]
  # pull_request:
  #   branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.publish == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
