# Usage: put a General MIDI .sf2 in ./soundfonts, then `docker compose up --build`.
# The app is published on 127.0.0.1:8000 only.
#
# AI and S3 backups are set per user in the app (Settings), not here. The claude-cli
# AI backend is not available in the container (no `claude` binary).
services:
  motif:
    build: .
    image: motif:local
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    # Accounts (see README → Accounts). Set the values in .env; empty admin email = local mode, no login.
    environment:
      MOTIF_ADMIN_EMAIL: ${MOTIF_ADMIN_EMAIL:-}
      MOTIF_ADMIN_PASSWORD: ${MOTIF_ADMIN_PASSWORD:-}
      MOTIF_PUBLIC_URL: ${MOTIF_PUBLIC_URL:-}
      MOTIF_SESSION_DAYS: ${MOTIF_SESSION_DAYS:-30}
      MOTIF_RENDER_WORKERS: ${MOTIF_RENDER_WORKERS:-2}
      MOTIF_SMTP_HOST: ${MOTIF_SMTP_HOST:-}
      MOTIF_SMTP_PORT: ${MOTIF_SMTP_PORT:-587}
      MOTIF_SMTP_USER: ${MOTIF_SMTP_USER:-}
      MOTIF_SMTP_PASSWORD: ${MOTIF_SMTP_PASSWORD:-}
      MOTIF_SMTP_FROM: ${MOTIF_SMTP_FROM:-}
      MOTIF_SMTP_TLS: ${MOTIF_SMTP_TLS:-starttls}
    volumes:
      - ./soundfonts:/soundfonts:ro
      - motif-data:/data
    restart: unless-stopped

  # Optional local S3 for backups:
  #   docker compose --profile minio up --build
  # Create a bucket once in the console at http://127.0.0.1:9001, then in Settings → Backups:
  # endpoint http://minio:9000, that bucket, and MINIO_ROOT_USER / MINIO_ROOT_PASSWORD as keys.
  # Set MINIO_ROOT_USER / MINIO_ROOT_PASSWORD in your shell or in a compose
  # .env file; the defaults below are for local testing only.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["minio"]
    command: server /minio-data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-motifadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/minio-data
    restart: unless-stopped

  # Optional PostgreSQL instead of SQLite:
  #   docker compose --profile postgres up --build
  # then in .env:
  #   MOTIF_DATABASE_URL=postgresql://motif:motif@postgres:5432/motif
  # Change POSTGRES_PASSWORD (and the URL) for anything beyond local testing.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: motif
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motif}
      POSTGRES_DB: motif
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  motif-data:
  minio-data:
  postgres-data:
