# Usage: put a General MIDI .sf2 in ./soundfonts, then `docker compose up --build`.
# The app is published on 127.0.0.1:8000 only.
#
# AI backends: the claude-cli backend is not available in the container
# (no `claude` binary). Use claude-api (ANTHROPIC_API_KEY) or openai
# (OPENAI_BASE_URL + OPENAI_API_KEY) in .env.
services:
  motif:
    build: .
    image: motif:local
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./soundfonts:/soundfonts:ro
      - motif-data:/data
    restart: unless-stopped

  # Optional local S3 for media and DB backups:
  #   docker compose --profile minio up --build
  # Create the bucket once in the console at http://127.0.0.1:9001, then in .env:
  #   S3_BUCKET=motif
  #   S3_ENDPOINT_URL=http://minio:9000
  #   AWS_ACCESS_KEY_ID=<MINIO_ROOT_USER>
  #   AWS_SECRET_ACCESS_KEY=<MINIO_ROOT_PASSWORD>
  # Set MINIO_ROOT_USER / MINIO_ROOT_PASSWORD in your shell or in a compose
  # .env file; the defaults below are for local testing only.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["minio"]
    command: server /minio-data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-motifadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/minio-data
    restart: unless-stopped

  # Optional PostgreSQL instead of SQLite:
  #   docker compose --profile postgres up --build
  # then in .env:
  #   MOTIF_DATABASE_URL=postgresql://motif:motif@postgres:5432/motif
  # Change POSTGRES_PASSWORD (and the URL) for anything beyond local testing.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: motif
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motif}
      POSTGRES_DB: motif
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  motif-data:
  minio-data:
  postgres-data:
